<p-button label="Go back" [link]="true" routerLink="" class="product-goBack-btn"/>

@if(productDetail$ | async; as details) {
    @if(!details){
        <div>
            Oops!, no data
        </div>
    }@else{
        <div class="product-detils-container">
            <div class="product-details-info">
                <p-galleria [value]="details.images" 
                    [indicatorsPosition]="'bottom'" 
                    [showIndicators]="true" 
                    [showThumbnails]="false"
                    [showItemNavigators]="true"
                    [showIndicatorsOnItem]="true" 
                    [autoPlay]="true" 
                    [circular]="true"
                    [containerStyle]="{ 'max-width': '640px' }" >
                    <ng-template pTemplate="item" let-item>
                        <img [src]="item" style="width: 100%; display: block;" />
                    </ng-template>
                </p-galleria>
                <div class="product-details-description">
                    <product-details-info [details]="details"></product-details-info>
                </div>
            </div>
            <div class="product-details-reviews">
                Score: {{details.rating}}
                Total: {{ details.reviews.length || 0}}
                <p-rating [ngModel]="details.rating" [readonly]="true" />
                @for(review of details.reviews; track review.reviewerEmail){
                    <div>
                        <p>{{ review.reviewerName }}</p>
                        <p-rating [ngModel]="review.rating" [readonly]="true" />
                        <p>{{ review.comment }}</p>
                    </div>
                }
            </div>
        </div>
    }
}@else{
    <p-skeleton styleClass="mb-2" />
    <p-skeleton width="10rem" styleClass="mb-2" />
    <p-skeleton width="5rem" styleClass="mb-2" />
    <p-skeleton height="2rem" styleClass="mb-2" />
    <p-skeleton width="10rem" height="4rem" />
}
