
@if(showLoader){
    <div class="rounded border border-surface-200 dark:border-surface-700 p-6 bg-surface-0 dark:bg-surface-900">
        <div class="flex mb-4">
            <p-skeleton shape="circle" size="4rem" styleClass="mr-2" />
            <div>
                <p-skeleton width="10rem" styleClass="mb-2" />
                <p-skeleton width="5rem" styleClass="mb-2" />
                <p-skeleton height=".5rem" />
            </div>
        </div>
        <p-skeleton width="100%" height="150px" />
        <div class="flex justify-between mt-4">
            <p-skeleton width="4rem" height="2rem" />
            <p-skeleton width="4rem" height="2rem" />
        </div>
    </div>
}@else{
    <div class="card-container">
        @for(product of products$ | async; track product.id){
            <p-card>
                <ng-template pTemplate="header">
                    <img alt="Card" class="card-image" [src]="product.thumbnail" [routerLink]="['product', product.id]"/>
                </ng-template>
                <ng-template pTemplate="title"> {{product.title}} </ng-template>
                <ng-template pTemplate="subtitle"> {{product.category}} </ng-template>
                <p>
                    {{product.description}}
                </p>
                <ng-template pTemplate="footer">
                    <div class="">
                        <p-button label="Add to cart" (click)="addToCart()"/>
                    </div>
                </ng-template>
            </p-card>
        }
    </div>
    <div>
        <p-paginator 
        (onPageChange)="onPageChange($event)" 
        [first]="first" 
        [rows]="rows" 
        [totalRecords]="total" 
        [rowsPerPageOptions]="rowsPerPage" />
    </div>
}
