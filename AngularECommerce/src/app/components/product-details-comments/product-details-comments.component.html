@if(details){
    <p-carousel
    [value]="details.reviews"
    [numVisible]="1"
    [numScroll]="1"
    [circular]="true">
        <ng-template let-review #item>
            <p-card header="{{ review.reviewerName }}">
                <p-rating [ngModel]="review.rating" [readonly]="true" />
                <p>{{ review.comment }}</p>
            </p-card>
        </ng-template>
    </p-carousel>
}
